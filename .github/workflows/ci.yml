name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an older run when new commits land on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build site
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Build Storybook
        run: npm run build-storybook -- --quiet

  lighthouse:
    name: Lighthouse (mobile + desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build site
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Lighthouse CI
        run: npm run lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
